<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pro Imports 3D | Início</title>
  
  <link rel="icon" type="image/png" href="logo.png">
  <link rel="apple-touch-icon" href="logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-body: #f8fafc;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --accent-cyan: #0284c7;
      --accent-orange: #f97316;
      --border-color: #e2e8f0;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--bg-body);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow-x: hidden;
    }

    .bg-gradient-1 {
      position: fixed; top: -10%; left: -10%; width: 45vw; height: 45vw;
      border-radius: 50%; background: radial-gradient(circle, rgba(14, 165, 233, 0.12) 0%, rgba(255, 255, 255, 0) 70%);
      z-index: -1; pointer-events: none;
    }

    .bg-gradient-2 {
      position: fixed; bottom: -10%; right: -10%; width: 50vw; height: 50vw;
      border-radius: 50%; background: radial-gradient(circle, rgba(249, 115, 22, 0.10) 0%, rgba(255, 255, 255, 0) 70%);
      z-index: -1; pointer-events: none;
    }

    /* HEADER & MENU COM BUSCA E PERSONAGEM */
    header {
      width: 100%;
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(12px);
      border-bottom: 2px solid var(--border-color);
      position: sticky;
      top: 0;
      z-index: 1000;
      padding: 0.85rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.03);
    }

    .header-track {
      position: absolute; bottom: -2px; left: 0; width: 100%; height: 2px;
      background: linear-gradient(90deg, transparent, var(--accent-cyan), var(--accent-orange), transparent);
      opacity: 0.3;
    }

    .funko-walker {
      position: absolute; bottom: 2px; left: -50px; width: 36px; height: 42px;
      z-index: 1001; pointer-events: none;
      animation: walkAcross 18s linear infinite, bobbing 0.4s ease-in-out infinite alternate;
    }

    @keyframes walkAcross {
      0% { left: -50px; transform: scaleX(1); }
      48% { transform: scaleX(1); }
      50% { left: calc(100% + 10px); transform: scaleX(-1); }
      98% { transform: scaleX(-1); }
      100% { left: -50px; transform: scaleX(1); }
    }

    @keyframes bobbing {
      0% { transform: translateY(0px); }
      100% { transform: translateY(-3px); }
    }

    .nav-logo img { height: 40px; width: auto; display: block; }

    .header-center { display: flex; align-items: center; gap: 1.5rem; }

    nav { display: flex; gap: 1.5rem; align-items: center; }

    nav a {
      text-decoration: none; color: var(--text-main); font-weight: 600; font-size: 1rem;
      padding: 0.5rem 0.75rem; border-radius: 8px; position: relative; transition: all 0.25s ease;
    }

    nav a:hover { color: var(--accent-cyan); background-color: rgba(2, 132, 199, 0.05); }
    nav a.active { color: var(--accent-cyan); font-weight: 700; }
    nav a.active::after {
      content: ''; position: absolute; bottom: -4px; left: 10%; width: 80%; height: 3px;
      background: linear-gradient(90deg, var(--accent-cyan), var(--accent-orange)); border-radius: 10px;
    }

    /* BARRA DE PESQUISA GLOBAL NO HEADER */
    .search-box { position: relative; display: flex; align-items: center; }
    .search-input {
      padding: 0.45rem 1rem 0.45rem 2.2rem; border: 1px solid var(--border-color);
      border-radius: 20px; font-size: 0.875rem; outline: none; background: #f1f5f9;
      transition: all 0.25s ease; width: 180px;
    }
    .search-input:focus {
      width: 240px; background: #ffffff; border-color: var(--accent-cyan);
      box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.15);
    }
    .search-icon { position: absolute; left: 0.75rem; font-size: 0.85rem; color: var(--text-muted); pointer-events: none; }

    .search-results {
      position: absolute; top: 110%; right: 0; width: 300px; background: #ffffff;
      border: 1px solid var(--border-color); border-radius: 12px;
      box-shadow: 0 10px 25px -5px rgba(0,0,0,0.1); display: none; z-index: 2000;
      overflow: hidden; max-height: 350px; overflow-y: auto;
    }
    .search-item {
      display: flex; justify-content: space-between; align-items: center;
      padding: 0.75rem 1rem; text-decoration: none; color: var(--text-main); font-size: 0.85rem;
      border-bottom: 1px solid #f1f5f9; transition: background 0.2s;
    }
    .search-item:hover { background: rgba(2, 132, 199, 0.05); color: var(--accent-cyan); }
    .search-category {
      font-size: 0.65rem; padding: 0.15rem 0.4rem; background: #e2e8f0;
      border-radius: 4px; color: var(--text-muted); white-space: nowrap;
    }
    .search-item-empty { padding: 0.85rem; text-align: center; font-size: 0.85rem; color: var(--text-muted); }

    /* CONTEÚDO CENTRAL */
    .container {
      max-width: 800px; width: 100%; margin: 0 auto; padding: 4rem 1rem;
      text-align: center; flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center;
    }
    .logo-container { margin-bottom: 2rem; }
    .logo-img { max-width: 280px; width: 100%; height: auto; display: block; margin: 0 auto; object-fit: contain; }

    .construction-loader { display: flex; gap: 1.5rem; align-items: center; justify-content: center; margin-bottom: 2rem; }
    .gear { font-size: 2.5rem; animation: spinGear 4s linear infinite; }
    .gear-reverse { font-size: 2rem; animation: spinGearRev 3s linear infinite; }
    .printer-icon { font-size: 3rem; animation: pulsePrinter 1.5s ease-in-out infinite alternate; }

    @keyframes spinGear { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    @keyframes spinGearRev { 0% { transform: rotate(360deg); } 100% { transform: rotate(0deg); } }
    @keyframes pulsePrinter { 0% { transform: scale(1); } 100% { transform: scale(1.1); } }

    h1 { font-size: 2.5rem; font-weight: 800; color: var(--text-main); margin-bottom: 0.75rem; letter-spacing: -0.02em; }
    .subtitle { font-size: 1.15rem; color: var(--text-muted); max-width: 550px; margin: 0 auto; line-height: 1.6; }

    footer {
      background: #ffffff; border-top: 1px solid var(--border-color);
      padding: 2rem 1rem; text-align: center; color: var(--text-muted); font-size: 0.875rem; margin-top: auto;
    }

    @media (max-width: 768px) {
      header { padding: 0.8rem 1rem; flex-direction: column; gap: 0.75rem; }
      .header-center { flex-direction: column; gap: 0.5rem; width: 100%; }
      .search-input { width: 100%; }
      .search-input:focus { width: 100%; }
      nav { gap: 0.5rem; }
      nav a { font-size: 0.85rem; padding: 0.3rem 0.4rem; }
      h1 { font-size: 2rem; }
    }
  </style>
</head>
<body>

  <div class="bg-gradient-1"></div>
  <div class="bg-gradient-2"></div>

  <header>
    <div class="nav-logo">
      <a href="index.html"><img src="logosemfundo.png" alt="Pro Imports 3D"></a>
    </div>

    <svg class="funko-walker" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
      <rect x="12" y="6" width="40" height="30" rx="8" fill="#1e293b"/>
      <path d="M12 14C12 9.58172 15.5817 6 20 6H44C48.4183 6 52 9.58172 52 14V18H12V14Z" fill="#0f172a"/>
      <circle cx="24" cy="22" r="4" fill="#ffffff"/>
      <circle cx="40" cy="22" r="4" fill="#ffffff"/>
      <circle cx="25" cy="21" r="1.5" fill="#0284c7"/>
      <circle cx="41" cy="21" r="1.5" fill="#0284c7"/>
      <rect x="24" y="38" width="16" height="14" rx="4" fill="#0284c7"/>
      <circle cx="25" cy="54" r="3" fill="#f97316"/>
      <circle cx="39" cy="54" r="3" fill="#f97316"/>
    </svg>

    <div class="header-track"></div>

    <div class="header-center">
      <div class="search-box">
        <span class="search-icon">🔍</span>
        <input type="text" id="searchInput" class="search-input" placeholder="Buscar no site..." onkeyup="executarBuscaGlobal()">
        <div id="searchResults" class="search-results"></div>
      </div>

      <nav>
        <a href="index.html" class="active">Início</a>
        <a href="filamentos.html">Filamentos</a>
        <a href="impressoes.html">Impressões 3D</a>
        <a href="contato.html">Contato</a>
      </nav>
    </div>
  </header>

  <div class="container">
    <div class="logo-container">
      <img src="logosemfundo.png" alt="Pro Imports 3D Logo" class="logo-img">
    </div>

    <div class="construction-loader">
      <span class="gear-reverse">⚙️</span>
      <span class="printer-icon">🖨️</span>
      <span class="gear">⚙️</span>
    </div>

    <h1>Site em Construção</h1>
    <p class="subtitle">
      Estamos estruturando uma plataforma completa para trazer o melhor em filamentos e impressões 3D. Em breve novidades por aqui!
    </p>
  </div>

  <footer>
    <p>&copy; 2026 Pro Imports 3D. Todos os direitos reservados.</p>
  </footer>

  <script src="search.js"></script>
</body>
</html>
