  <!-- SCRIPT DE ANIMAÇÃO DA PISCADA DO MASCOTE -->
  <script>
    const mascotImg = document.getElementById('mascotImg');
    const mascotLink = document.getElementById('mascotLink');

    const imgAbertos = "mascote/olhos-abertos.png";
    const imgMeio = "mascote/meio-abertos.png";
    const imgFechados = "mascote/olhos-fechados.png";
    const imgPiscando = "mascote/piscando.png";

    let isHovered = false;

    mascotLink.addEventListener('mouseenter', () => {
      isHovered = true;
      mascotImg.src = imgPiscando;
    });

    mascotLink.addEventListener('mouseleave', () => {
      isHovered = false;
    });

    function executarPiscada() {
      if (isHovered) return;

      mascotImg.src = imgMeio;
      
      setTimeout(() => {
        if (isHovered) return;
        mascotImg.src = imgFechados;
        
        setTimeout(() => {
          if (isHovered) return;
          mascotImg.src = imgMeio;
          
          setTimeout(() => {
            if (isHovered) return;
            mascotImg.src = imgAbertos;
          }, 120);
        }, 150);
      }, 120);
    }

    function agendarProximaPiscada() {
      const tempoAleatorio = Math.random() * 3000 + 3000;
      setTimeout(() => {
        executarPiscada();
        agendarProximaPiscada();
      }, tempoAleatorio);
    }

    agendarProximaPiscada();
  </script>
