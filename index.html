<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pro Imports 3D | Início</title>
  <link rel="icon" type="image/png" href="logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-body: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --accent-cyan: #0284c7;
      --accent-orange: #f97316;
      --border-color: #e2e8f0;
      --shadow-sm: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
      --shadow-lg: 0 20px 25px -5px rgba(0, 0, 0, 0.08);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--bg-body);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    header {
      width: 100%;
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(12px);
      border-bottom: 2px solid var(--border-color);
      position: sticky;
      top: 0;
      z-index: 1000;
      padding: 0.85rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .nav-logo img {
      height: 40px;
      width: auto;
      display: block;
    }

    nav {
      display: flex;
      gap: 2rem;
      align-items: center;
    }

    nav a {
      text-decoration: none;
      color: var(--text-main);
      font-weight: 600;
      font-size: 1.05rem;
      padding: 0.5rem 0.75rem;
      border-radius: 8px;
      transition: all 0.25s ease;
    }

    nav a:hover {
      color: var(--accent-cyan);
      background-color: rgba(2, 132, 199, 0.05);
    }

    nav a.active {
      color: var(--accent-cyan);
      font-weight: 700;
    }

    .container {
      max-width: 900px;
      width: 100%;
      margin: 0 auto;
      padding: 4rem 1rem;
      text-align: center;
      flex: 1;
    }

    .logo-container {
      margin-bottom: 2rem;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .logo-img {
      max-width: 240px;
      width: 100%;
      height: auto;
      display: block;
      margin: 0 auto;
      object-fit: contain;
    }

    h1 {
      font-size: 2.25rem;
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: 1rem;
    }

    .subtitle {
      font-size: 1.125rem;
      color: var(--text-muted);
      margin-bottom: 3rem;
      line-height: 1.6;
    }

    footer {
      background: #ffffff;
      border-top: 1px solid var(--border-color);
      padding: 2rem 1rem;
      text-align: center;
      color: var(--text-muted);
      font-size: 0.875rem;
      margin-top: auto;
    }
  </style>
</head>
<body>

  <header>
    <div class="nav-logo">
      <a href="index.html"><img src="logo.png" alt="Pro Imports 3D"></a>
    </div>
    <nav>
      <a href="index.html" class="active">Início</a>
      <a href="filamentos.html">Filamentos</a>
      <a href="impressoes.html">Impressões 3D</a>
      <a href="contato.html">Contato</a>
    </nav>
  </header>

  <div class="container">
    <div class="logo-container">
      <img src="logo.png" alt="Pro Imports 3D Logo" class="logo-img">
    </div>

    <h1>Soluções de Alta Precisão em Impressão 3D</h1>
    <p class="subtitle">
      Revenda autorizada de filamentos Masterprint e desenvolvimento de peças personalizadas.
    </p>
  </div>

  <footer>
    <p>&copy; 2026 Pro Imports 3D. Todos os direitos reservados.</p>
  </footer>

</body>
</html>
