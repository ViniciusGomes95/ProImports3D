<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro Imports 3D - Site em Construção</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;900&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-main: #0B0E14;
            --bg-card: #151A23;
            --bg-card-hover: #1E2532;
            --accent-cyan: #00f2fe;
            --accent-blue: #4facfe;
            --accent-petg: #ff9f43;
            --accent-pla: #10ac84;
            --text-primary: #FFFFFF;
            --text-secondary: #94A3B8;
            --border-color: #2A3447;
        }
 
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Montserrat', sans-serif;
        }
 
        body {
            background-color: var(--bg-main);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 2rem 1rem;
            overflow-x: hidden;
        }
 
        /* Container Principal */
        .container {
            max-width: 1000px;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2.5rem;
        }
 
        /* Header e Logo */
        .header {
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1rem;
            margin-top: 1rem;
        }
 
        .logo-wrapper {
            background: #ffffff;
            padding: 1.5rem 2.5rem;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 242, 254, 0.15);
            display: inline-block;
            transition: transform 0.3s ease;
        }
 
        .logo-wrapper:hover {
            transform: scale(1.02);
        }
 
        .logo-svg {
            width: 260px;
            height: auto;
            display: block;
        }
 
        /* Status Badge */
        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.6rem;
            background: rgba(0, 242, 254, 0.1);
            border: 1px solid var(--accent-cyan);
            color: var(--accent-cyan);
            padding: 0.5rem 1.2rem;
            border-radius: 50px;
            font-size: 0.85rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }
 
        .pulse-dot {
            width: 10px;
            height: 10px;
            background-color: var(--accent-cyan);
            border-radius: 50%;
            box-shadow: 0 0 10px var(--accent-cyan);
            animation: pulse 1.5s infinite;
        }
 
        @keyframes pulse {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(0, 242, 254, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 10px rgba(0, 242, 254, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(0, 242, 254, 0); }
        }
 
        /* Título e Subtítulo */
        .hero-text {
            text-align: center;
            max-width: 650px;
        }
 
        .hero-text h1 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 0.8rem;
            background: linear-gradient(135deg, #ffffff 0%, #a5b4fc 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
 
        .hero-text p {
            color: var(--text-secondary);
            font-size: 1.05rem;
            line-height: 1.6;
        }
 
        /* Animação do Bico de Impressão 3D */
        .printer-canvas-container {
            width: 100%;
            height: 180px;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            position: relative;
            overflow: hidden;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            justify-content: center;
        }
 
        .hotend-nozzle {
            position: absolute;
            top: 20px;
            width: 30px;
            height: 40px;
            background: linear-gradient(180deg, #64748b, #334155);
            clip-path: polygon(0 0, 100% 0, 70% 80%, 55% 100%, 45% 100%, 30% 80%);
            animation: moveNozzle 4s ease-in-out infinite alternate;
            z-index: 10;
        }
